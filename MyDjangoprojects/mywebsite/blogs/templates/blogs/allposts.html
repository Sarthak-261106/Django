{% extends "base.html" %}
{% load static %}
{% block css_files %}
<link rel="stylesheet" href="{% static 'blogs/app.css' %}">
{% endblock %}


{% block page_title %}
All posts
{% endblock %}


{% block body_content %}
<section>
    <h2>ALL MY POSTS!!!!!</h2>
<ul>
    {% for blog in blogs %}
    <li>
        <article>
            <a href="{% url 'blog-post' blog=blog.slug %}">{{blog.title}}</a>
            <img src="{% static 'blogs/images/'|add:blog.image %}" alt="{{ blog.title }}"/>
            <div>
                <p>{{ blog.preview }}</p>
            </div>
        </article>
    </li>
    {% endfor %}

</ul>
    </section>
{% endblock %}
